version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: esitv
      POSTGRES_PASSWORD: esitvpassword
      POSTGRES_DB: esitvdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    command: npm run worker:media
    environment:
      DATABASE_URL: postgresql://esitv:esitvpassword@db:5432/esitvdb
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MEDIA_WORKER_VERSION: docker-local
    depends_on:
      - db
      - minio
      - redis

  livekit:
    image: livekit/livekit-server:latest
    restart: always
    command: --dev --keys devkey:secret
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
  minio_data:
  redis_data:
