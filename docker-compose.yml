services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: esitv
      POSTGRES_PASSWORD: esitvpassword
      POSTGRES_DB: esitvdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    command: npm run worker:media
    environment:
      DATABASE_URL: postgresql://esitv:esitvpassword@db:5432/esitvdb
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MEDIA_WORKER_VERSION: docker-local
    depends_on:
      - db
      - minio
      - redis

  livekit:
    image: livekit/livekit-server:v1.13.4@sha256:189f7c81b704a36642bc5c7e2d3e1ae83744627c11978a23a251bf19fbec64e0
    restart: always
    entrypoint: ["sh", "/usr/local/bin/start-livekit.sh"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      LIVEKIT_CONFIG_PATH: /etc/livekit/livekit.yaml
      LIVEKIT_KEY_FILE: /tmp/livekit.keys
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
      - ./scripts/start-livekit.sh:/usr/local/bin/start-livekit.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  pgdata:
  minio_data:
  redis_data:
